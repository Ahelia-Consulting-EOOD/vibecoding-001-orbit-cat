<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbit Cat — The Snack Mission</title>
  <link rel="icon" href="data:,">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#f6f4ee;background:#0d1527}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;gap:18px}
    h1{margin:0;font-size:clamp(20px,3vw,30px);letter-spacing:-.03em}header p{margin:4px 0 0;color:#a5b6ce;font-size:15px}
    .mission{border:1px solid #334663;border-radius:12px;padding:9px 14px;color:#bafa85;font-weight:700;font-size:14px}
    canvas{width:100%;height:auto;display:block;border:1px solid #334663;border-radius:22px;background:#14233c}
    footer{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:18px;flex-wrap:wrap}
    .controls{display:flex;gap:10px}button{font:700 17px system-ui;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;background:#bafa85;color:#15212c}
    button.secondary{background:#25344d;color:#f6f4ee}button:focus-visible{outline:3px solid #ffb879;outline-offset:4px}
    #status{margin:0;color:#c5d3e6;max-width:480px;font-size:16px}.hint{color:#91a6c4;font-size:13px;margin-top:15px}
    @media(max-width:600px){body{padding:12px}header{align-items:flex-start}.mission{font-size:11px;padding:8px}header p{font-size:12px}button{font-size:15px;padding:12px 16px}}
  </style>
</head>
<body>
<main>
  <header><div><h1>ORBIT CAT</h1><p>The snack mission</p></div><div class="mission">CATCH THE SNACK · LAND SAFELY</div></header>
  <canvas id="game" width="1100" height="560" aria-label="Orange cat on a launchpad with a floating fish snack above it"></canvas>
  <footer><div class="controls"><button id="jump">Jump · Space</button><button class="secondary" id="retry">Retry · R</button></div><p id="status" role="status">One small jump. One very important snack.</p></footer>
  <p class="hint">No account. No installation. Change one thing, then try it.</p>
</main>
<script src="config.js"></script>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GROUND = 426, CAT_X = 350, CAT_H = 58, GRAVITY = 1100, SNACK_Y = 312;
const statusEl = document.getElementById('status');
function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function text(value,x,y,size,color='#f6f4ee',weight=600){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;ctx.fillText(value,x,y)}
function fish(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#bafa85';ctx.beginPath();ctx.ellipse(0,0,19,12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(31,-16);ctx.lineTo(31,16);ctx.closePath();ctx.fill();ctx.fillStyle='#14233c';ctx.beginPath();ctx.arc(-9,-3,2.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function cat(x,y,flight){
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle='#ffb879';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-30,32);ctx.quadraticCurveTo(-63,42,-52,9);ctx.stroke();
  roundRect(-36,0,76,58,16,'#ffb879');
  ctx.fillStyle='#ffb879';ctx.beginPath();ctx.moveTo(-32,13);ctx.lineTo(-28,-24);ctx.lineTo(-7,3);ctx.moveTo(7,3);ctx.lineTo(31,-24);ctx.lineTo(36,14);ctx.fill();
  ctx.fillStyle='#f39493';ctx.beginPath();ctx.moveTo(-25,1);ctx.lineTo(-25,-12);ctx.lineTo(-16,1);ctx.moveTo(17,1);ctx.lineTo(28,-12);ctx.lineTo(29,1);ctx.fill();
  ctx.fillStyle='#17243c';for(const eye of [-9,19]){ctx.beginPath();ctx.ellipse(eye,21,4,flight?7:5,0,0,Math.PI*2);ctx.fill()}
  ctx.strokeStyle='#17243c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,30);ctx.lineTo(4,35);ctx.moveTo(-1,35);ctx.quadraticCurveTo(4,40,9,35);ctx.stroke();
  ctx.fillStyle='#f7a56d';ctx.fillRect(-26,48,16,10);ctx.fillRect(16,48,16,10);ctx.restore();
}
window.game={
  manual:false,time:0,y:GROUND-CAT_H,vy:0,jumping:false,collected:false,landed:false,attempted:false,
  reset(){this.time=0;this.y=GROUND-CAT_H;this.vy=0;this.jumping=false;this.collected=false;this.landed=false;this.attempted=false;this.draw();return this.snapshot()},
  jump(){if(this.jumping||this.attempted)return false;this.vy=-CONFIG.jumpStrength;this.jumping=true;this.attempted=true;this.draw();return true},
  snapshot(){return {time:this.time,y:this.y,vy:this.vy,jumping:this.jumping,collected:this.collected,landed:this.landed,attempted:this.attempted,jumpStrength:CONFIG.jumpStrength}},
  step(dt){
    if(!Number.isFinite(dt)||dt<0||dt>.05)throw new Error('Use a time step between 0 and 0.05 seconds');
    this.time+=dt;
    if(this.jumping){
      const previousCenter=this.y+CAT_H/2;
      this.vy+=GRAVITY*dt;this.y+=this.vy*dt;
      const center=this.y+CAT_H/2;
      // Swept vertical overlap prevents fast jumps skipping the snack between frames.
      if(Math.min(previousCenter,center)-24<=SNACK_Y&&Math.max(previousCenter,center)+24>=SNACK_Y)this.collected=true;
      if(this.y>=GROUND-CAT_H){this.y=GROUND-CAT_H;this.vy=0;this.jumping=false;this.landed=true}
    }
    this.draw();return this.snapshot();
  },
  draw(){
    const gradient=ctx.createLinearGradient(0,0,0,560);gradient.addColorStop(0,'#101b32');gradient.addColorStop(1,'#203750');ctx.fillStyle=gradient;ctx.fillRect(0,0,1100,560);
    for(let i=0;i<55;i++){const x=(i*193+41)%1100,y=(i*89+27)%350;ctx.fillStyle=i%7?'#506787':'#bafa85';ctx.globalAlpha=.65+.25*Math.sin(this.time*.5+i);ctx.beginPath();ctx.arc(x,y,i%7?1.3:2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
    ctx.fillStyle='#253957';ctx.beginPath();ctx.arc(900,135,72,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#53638b';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(900,135,110,21,-.25,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#263d54';ctx.beginPath();ctx.moveTo(0,426);for(let x=0;x<=1100;x+=50)ctx.lineTo(x,408+15*Math.sin(x/150));ctx.lineTo(1100,560);ctx.lineTo(0,560);ctx.fill();
    roundRect(240,426,220,34,12,'#4b6571');roundRect(240,426,220,7,3,'#bafa85');
    ctx.strokeStyle='#648489';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(260+i*42,442);ctx.lineTo(275+i*42,453);ctx.stroke()}
    if(!this.collected){ctx.strokeStyle='#476b65';ctx.lineWidth=1;ctx.setLineDash([3,6]);ctx.beginPath();ctx.arc(CAT_X,SNACK_Y,37,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);fish(CAT_X,SNACK_Y)}
    if(this.y>-90)cat(CAT_X,this.y,this.jumping);
    roundRect(32,29,270,60,14,'#172943');text('LAUNCH SPEED',50,52,12,'#9db2cc');text(`${CONFIG.jumpStrength} px/s`,50,77,22,'#bafa85');
    roundRect(752,331,312,143,18,'#172943');text('MISSION CHECK',775,364,14,'#9db2cc');text(`${this.collected?'✓':'○'}  Catch the snack`,775,402,22,this.collected?'#bafa85':'#c2ccda');text(`${this.landed?'✓':'○'}  Land on the pad`,775,442,22,this.landed?'#bafa85':'#c2ccda');
    if(this.y<-90){text('CAT OUT OF FRAME',390,132,30,'#ffb879');text('That was a lot of enthusiasm.',392,167,18,'#c2ccda');ctx.strokeStyle='#ffb879';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(CAT_X,122);ctx.lineTo(CAT_X,60);ctx.lineTo(CAT_X-9,72);ctx.moveTo(CAT_X,60);ctx.lineTo(CAT_X+9,72);ctx.stroke()}
    text('LAUNCHPAD 01',247,498,14,'#94acc5');
    const message=this.landed?(this.collected?'Snack secured. Cat back on the pad. Mission complete.':'Back on the pad. The snack is still waiting.'):this.y<-90?'Cat outside the screen. Retry brings the attempt back.':this.jumping?'Snack first. Landing next.':'One small jump. One very important snack.';
    statusEl.textContent=message;
  }
};
document.getElementById('jump').addEventListener('click',()=>game.jump());
document.getElementById('retry').addEventListener('click',()=>game.reset());
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();game.jump()}else if(e.code==='KeyR')game.reset()});
game.reset();let previous=performance.now();
function tick(now){const dt=Math.max(0,Math.min((now-previous)/1000,.03));previous=now;if(!game.manual)game.step(dt);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
</body>
</html>
